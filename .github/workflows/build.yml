name: Build Windows

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx electron-builder --win --publish never
      - name: Zip portable folder
        shell: pwsh
        run: Compress-Archive -Path dist/win-unpacked/* -DestinationPath dist/PokeRogue-Coop-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: PokeRogue-Coop-Windows
          path: |
            dist/PokeRogue-Coop-Windows.zip
            dist/*.exe
      - name: Attach to release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/PokeRogue-Coop-Windows.zip
            dist/*.exe
